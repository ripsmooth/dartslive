<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darts TV – Sarjataulukko</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
#board{width:990px;background:#111519;border:2px solid #e8c917;border-radius:10px;overflow:hidden;box-shadow:0 8px 18px #0005}
#title{background:#e8c917;color:#080b0d;font-size:29px;font-weight:900;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}
#title small{font-size:14px}table{width:100%;border-collapse:collapse;table-layout:auto}thead{background:#192329;color:#e8c917;font-weight:bold}th,td{padding:10px 12px;text-align:center;white-space:nowrap}th:nth-child(2),td:nth-child(2){text-align:left}tbody tr:nth-child(even){background:#1a2227}tbody tr{border-bottom:1px solid #2c383f;font-weight:bold}td:nth-child(2){color:#fff}#footer{padding:8px 12px;border-top:1px solid #39434a;color:#9aa8b0;font-size:12px;display:flex;justify-content:space-between}
#error{color:#ff8585;text-align:center;padding:18px} </style></head><body><div id="board"><div id="title"><span id="heading">AVOIN MESTARUUS – SARJATAULUKKO</span><small>2026–27</small></div><table><thead><tr><th>#</th><th>Joukkue</th><th>Ott.</th><th>V</th><th>T</th><th>H</th><th>Pelisuhde</th><th>Heitto ka.</th><th>Pisteet</th></tr></thead><tbody id="rows"><tr><td colspan="9">Ladataan...</td></tr></tbody></table><div id="footer"><span id="status">Kisailu.net</span><span>KISAILU.NET</span></div></div>
<script>
const p=new URLSearchParams(location.search);const teamType=p.get('sarja')||'SmLiiga';const season=p.get('season')||'SEA#sdlsml202627';const title=p.get('nimi')||'AVOIN MESTARUUS';const refresh=Math.max(10,Number(p.get('refresh')||30))*1000;
document.getElementById('heading').textContent=title.toUpperCase()+' – SARJATAULUKKO';
const board=document.getElementById('board');board.style.width=(Number(p.get('width')||990))+'px';board.style.transform='scale('+(Number(p.get('scale')||100)/100)+')';board.style.transformOrigin='top left';
function listOf(d){if(Array.isArray(d))return d;for(const k of ['Teams','teams','Items','items','Data','data'])if(Array.isArray(d?.[k]))return d[k];return []}
function val(s,...keys){for(const k of keys){let x=s?.[k];if(x!==undefined&&x!==null&&x!=='')return x}return '-'}
async function load(){try{const r=await fetch('/api/teams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({SeasonId:season,OrganizationId:'ORG#937795',TeamType:teamType,Active:true})});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const teams=listOf(d);if(!teams.length)throw Error('API-vastaus ei sisältänyt joukkue-listaa');teams.sort((a,b)=>Number(a.Stat?.R||a.Rank||999)-Number(b.Stat?.R||b.Rank||999));document.getElementById('rows').innerHTML=teams.map((t,i)=>{const s=t.Stat||t.stat||{};const name=t.Team||t.team||t.Name||t.name||'Joukkue';const ratio=val(s,'RW','Ratio','ratio')!=='-'?val(s,'RW','Ratio','ratio')+'-'+val(s,'RL','ratioLoss'):val(t,'Ratio','ratio');const avg=val(s,'AVG','Avg','Average','average','TP');return `<tr><td>${val(s,'R','Rank')||i+1}</td><td>${name}</td><td>${val(s,'M','MP','Matches','Played')}</td><td>${val(s,'W','Wins')}</td><td>${val(s,'T','Ties')}</td><td>${val(s,'L','Losses')}</td><td>${ratio}</td><td>${avg}</td><td>${val(s,'PTS','Points')}</td></tr>`}).join('');document.getElementById('status').textContent='Päivitetty '+new Date().toLocaleTimeString('fi-FI')}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="9" id="error">Tietojen haku epäonnistui: '+e.message+'</td></tr>';document.getElementById('status').textContent='Virhe'}}load();setInterval(load,refresh);
</script></body></html>
