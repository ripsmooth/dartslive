<!DOCTYPE html><html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darts TV – Sarjataulukko</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}.wrap{width:var(--width,990px);background:#111519;border:2px solid #e9c916;border-radius:12px;overflow:hidden;box-shadow:0 10px 22px #0005}.top{background:#e9c916;color:#050505;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:900}.title{font-size:30px}.season{font-size:16px}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th{background:#192329;color:#e9c916;font-size:17px;padding:11px 6px}.table td{padding:10px 6px;text-align:center;font-weight:700;border-bottom:1px solid #303b42;font-size:16px}.table tbody tr:nth-child(even){background:#1a2228}.table td.team{text-align:left;padding-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table td.rank{width:48px}.foot{display:flex;justify-content:space-between;padding:8px 12px;color:#8fa2b0;font-size:13px;border-top:1px solid #303b42}.error{color:#ff7181;padding:18px;text-align:center}.hidden{display:none}
</style></head><body><div class="wrap" id="wrap"><div class="top"><div class="title" id="title">AVOIN MESTARUUS – SARJATAULUKKO</div><div class="season" id="season">2026–27</div></div><table class="table"><thead><tr><th style="width:48px">#</th><th style="text-align:left">Joukkue</th><th>Ott.</th><th>V</th><th>T</th><th>H</th><th>Pelisuhde</th><th>Heitto ka.</th><th>Pisteet</th></tr></thead><tbody id="rows"><tr><td colspan="9">Ladataan…</td></tr></tbody></table><div class="foot"><span id="status">Kisailu.net</span><span>KISAILU.NET</span></div></div>
<script>
const p=new URLSearchParams(location.search);const category=p.get('sarja')||'MM';const seasonId=p.get('season')||'SEA#sdlsml202627';const refresh=Math.max(5,Number(p.get('refresh')||30))*1000;const scale=Number(p.get('scale')||100);const width=Number(p.get('width')||990);const right=p.get('right');const bottom=p.get('bottom');
document.documentElement.style.setProperty('--width',width+'px');document.body.style.transform='scale('+scale/100+')';document.body.style.transformOrigin='top left';if(right!==null||bottom!==null){document.body.style.position='absolute';if(right!==null)document.body.style.right=right+'px';if(bottom!==null)document.body.style.bottom=bottom+'px'}
const labels={MM:'AVOIN MESTARUUS',M1:'AVOIN 1DIV',M2:'AVOIN 2DIV',M3:'AVOIN 3DIV',NM:'NAISTEN MESTARUUS',N1:'NAISTEN 1DIV'};document.getElementById('title').textContent=(labels[category]||category)+' – SARJATAULUKKO';document.getElementById('season').textContent=p.get('seasonLabel')||'2026–27';
function arrFrom(x){if(Array.isArray(x))return x;if(x&&typeof x==='object'){for(const k of ['Teams','teams','Items','items','Data','data','body','Results','results'])if(Array.isArray(x[k]))return x[k];for(const v of Object.values(x)){const a=arrFrom(v);if(a.length)return a}}return []}
function num(v){return Number(v||0)}function ratio(a,b){return a+'/'+b}function avg(o){let s=o.Stat||{};return s.TD? (num(s.TP)/num(s.TD)).toFixed(2):'-'}
async function load(){try{const r=await fetch('/api/teams',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({SeasonId:seasonId,OrganizationId:'ORG#937795',TeamType:'SmLiiga',Active:true})});if(!r.ok)throw new Error('HTTP '+r.status);const raw=await r.json();let list=arrFrom(raw);if(!list.length)throw new Error('API-vastaus ei sisältänyt joukkue-listaa');list=list.filter(x=>String(x.Data||x.EventDetails?.Level||'')===category);list.sort((a,b)=>num(a.Stat?.R)-num(b.Stat?.R));if(!list.length)throw new Error('Sarjasta '+category+' ei löytynyt joukkueita');document.getElementById('rows').innerHTML=list.map((o,i)=>{const s=o.Stat||{};return `<tr><td class="rank">${s.R||i+1}</td><td class="team">${o.Team||o.EventDetails?.Name||'?'}</td><td>${s.NG??'-'}</td><td>${s.W??'-'}</td><td>${s.T??'-'}</td><td>${s.L??'-'}</td><td>${ratio(s.RW??0,s.RL??0)}</td><td>${avg(o)}</td><td>${s.PTS??'-'}</td></tr>`}).join('');document.getElementById('status').textContent='Päivitetty '+new Date().toLocaleTimeString('fi-FI')}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="9" class="error">Tietojen haku epäonnistui: ${e.message}</td></tr>`;document.getElementById('status').textContent='Virhe'}}load();setInterval(load,refresh);
</script></body></html>
