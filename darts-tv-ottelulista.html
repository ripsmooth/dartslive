<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darts TV – ottelujärjestys</title>
<style>
:root{--yellow:#ffe500;--green:#00f52d;--bg:#05090b;--line:#344047;--white:#f7f9fa;--muted:#aab5ba}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{position:relative}
#wrap{position:absolute;left:50%;top:50%;width:var(--content-width,1920px);height:1080px;padding:0 22px 12px;display:flex;flex-direction:column;transform-origin:center center;background:linear-gradient(145deg,#05090b 0%,#081015 52%,#05090b 100%)}
header{height:112px;flex:0 0 112px;display:grid;grid-template-columns:minmax(0,1fr) 420px;align-items:center;gap:20px;padding:0 22px 0 8px;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,var(--yellow) 0 68%,var(--green) 68% 100%) 1;background:linear-gradient(110deg,#080e12 0%,#101a20 52%,#080e12 100%);position:relative}
header:after{content:"";position:absolute;right:0;top:0;width:30px;height:100%;background:var(--green);clip-path:polygon(65% 0,100% 0,35% 100%,0 100%)}
.titleblock{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px}
.titlebadge{display:inline-flex;align-items:center;min-height:58px;padding:0 40px;background:var(--yellow);color:#05090b;font-size:40px;line-height:1;font-weight:1000;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.subtitle{max-width:100%;color:#d6dee2;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.liveinfo{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;min-width:0;padding-right:24px;text-align:right;white-space:nowrap}

.statusline{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--muted);font-size:14px;font-weight:900;text-transform:uppercase}
.connection{display:inline-flex;align-items:center;gap:7px;color:var(--green)}
.connection:before{content:"";width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px #00f52d88}
.connection.bad:before{background:#ff6868;box-shadow:0 0 8px #ff686888}
.connection.bad{color:#ff6868}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px #00f52d88}
#content{height:0;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:15px;padding:15px 0 13px}
.match-column{min-width:0;min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));row-gap:9px}
.match{position:relative;min-width:0;min-height:0;display:grid;grid-template-columns:82px minmax(0,1fr) 108px 126px 132px;align-items:center;gap:8px;padding:7px 9px;background:linear-gradient(110deg,#172126 0%,#0b1115 100%);border:1px solid #526067;border-left:4px solid var(--green);border-radius:10px;overflow:hidden;box-shadow:0 4px 13px #0009,inset 0 1px 0 #ffffff12}
.match:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--yellow),transparent 65%,var(--green));opacity:.72}
.match.live{border-color:#a1a99b;border-left-color:var(--yellow);box-shadow:0 0 0 1px #ffe50030,0 5px 14px #0009}
.match.waiting{border-left-color:#66747b}
.match.done{border-left-color:var(--green)}
.number{width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:var(--yellow);color:#05090b;font-size:30px;line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,88% 0,100% 100%,0 100%);padding-right:7px;text-shadow:0 1px 0 #ffffff55}
.players{min-width:0;min-height:0;height:100%;display:grid;grid-template-rows:1fr 1fr;align-items:center}
.player{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:2px 4px;border-bottom:1px solid #344047}
.player:last-child{border-bottom:0}
.name{min-width:0;color:var(--white);font-size:clamp(16px,1.14vw,24px);line-height:1.05;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avgline{display:flex;align-items:center;gap:5px;color:var(--green);font-size:clamp(12px,.88vw,17px);font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.avgline b{font-size:inherit;font-weight:1000;letter-spacing:.1px}
.score{height:58px;display:flex;align-items:center;justify-content:center;padding:0 5px;background:var(--yellow);color:#05090b;border:1px solid #fff17a;border-radius:7px;font-size:clamp(22px,1.65vw,34px);font-weight:1000;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px #0002}
.meta{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-left:8px;border-left:1px solid #657178;text-align:center}
.stage{min-width:0;color:#f7f9fa;font-size:clamp(13px,.95vw,19px);font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board,.time{min-width:0;color:#c2cbd0;font-size:clamp(10px,.68vw,13px);line-height:1.05;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{min-width:0;height:43px;display:flex;align-items:center;justify-content:center;padding:0 7px;border:2px solid #59656b;border-radius:7px;background:linear-gradient(180deg,#354148,#1b252b);color:#e1e7ea;font-size:clamp(11px,.78vw,16px);font-weight:1000;letter-spacing:.1px;text-transform:uppercase;white-space:nowrap}
.state.live{border-color:var(--yellow);background:#28270d;color:var(--yellow);box-shadow:0 0 12px #ffe50020}
.state.done{border-color:#00b927;background:#03280c;color:var(--green);box-shadow:0 0 10px #00f52d18}
.empty,.error{grid-column:1/-1;align-self:center;padding:28px;background:#111c22;color:#ffd9d9;border:1px solid #a33;font-size:18px}
footer{height:31px;flex:0 0 31px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.3px;padding:7px 4px 0;border-top:1px solid #354047;position:relative}
footer:before{content:"";position:absolute;left:0;top:-3px;width:30%;height:7px;background:var(--green);clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
footer:after{content:"";position:absolute;right:0;top:-3px;width:35%;height:7px;background:var(--yellow);clip-path:polygon(4% 0,100% 0,100% 100%,0 100%)}
@media (prefers-reduced-motion:no-preference){.match.live .state{animation:livePulse 2.2s ease-in-out infinite}@keyframes livePulse{50%{box-shadow:0 0 14px #ffe50055}}}
</style></head><body><div id="wrap"><header><div class="titleblock"><span class="titlebadge">OTTELUJÄRJESTYS</span><span class="subtitle" id="eventTitle">Kisailu · haetaan kilpailua…</span></div><div class="liveinfo"><span class="statusline"><span id="connection" class="connection">LIVE-DATA</span><span id="status">Haetaan otteluita…</span></span></div></header><main id="content"></main><footer><span>OTTELUT KISAILU.NETIN JÄRJESTYKSESSÄ · KA = OTTELUN 3 TIKAN KESKIARVO</span><span id="refreshInfo"></span></footer></div>
<script>

const params=new URLSearchParams(location.search);
const eventId=(params.get('event')||params.get('eventId')||'EVE#sml26p0426').trim();
const refreshMs=Math.max(3000,Math.min(60000,(Number(params.get('refresh'))||10)*1000));
const scale=Math.max(50,Math.min(200,Number(params.get('scale'))||100))/100;
const width=Math.max(900,Math.min(5000,Number(params.get('width'))||1920));
const $=id=>document.getElementById(id);
let games=[],players={},eventTitle='Ottelupäivän ottelut',refreshTimer=null,pageTimer=null,inFlight=false,lastUpdated=null,pageIndex=0;
const decodeGame=item=>{
  const raw=item?.GameData;
  if(typeof raw!=='string')return raw||item;
  const id=String(item.Id??item.id??'');
  try{
    const bytes=new Uint8Array(raw.match(/.{2}/g).map(x=>parseInt(x,16)));
    const out=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++)out[i]=bytes[i]^id.charCodeAt(i%id.length);
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){console.warn('Ottelun datan purku epäonnistui',id,e);return {};}
};
const normalize=item=>{
  const d=decodeGame(item);
  return {...d,apiId:item?.Id??item?.id??d.Id??d.GameId??d.GameID,EndTime:d.EndTime??0};
};
function extractPlayers(data){
  const root=data?.EventData||data?.eventData||data;
  const src=root?.GamePlayers??root?.gamePlayers??root?.Players??root?.players;
  const out={};
  if(Array.isArray(src))src.forEach((p,i)=>{
    if(typeof p==='string'){out[String(i)]=p;return;}
    if(!p)return;
    const name=String(p.Name??p.name??p.DisplayName??p.displayName??p.Title??p.title??('Pelaaja '+i));
    out[String(p.index??p.Index??i)]=name;
    if(p.id??p.Id)out[String(p.id??p.Id)]=name;
  });
  else if(src&&typeof src==='object')for(const [k,p] of Object.entries(src)){
    out[String(k)]=typeof p==='string'?p:String(p?.Name??p?.name??p?.DisplayName??p?.displayName??p?.Title??p?.title??p);
  }
  return out;
}
function playerName(g,i){
  const p=(g.players||[])[i];
  if(p===undefined||p===null||Number(p)<0||Number(p)===40)return 'Odottaa jatkoonmenijää';
  return players[String(p)]||('Pelaaja '+p);
}
function publicEventTitle(value){const clean=String(value??'').replace(/EVE#[A-Za-z0-9_-]+/gi,'').replace(/[·|–—-]+/g,' ').replace(/\s+/g,' ').trim();return clean||'Ottelupäivän ottelut';}
function stageCode(g){return String(g.r??g.round??g.Round??'').trim().toUpperCase();}
function stageName(g){
  const custom=String(g.d??'').trim();
  if(custom&&custom!=='-'&&!/^[AB]$/i.test(custom))return custom;
  const map={AQF:'A-puolivälierät',ASF:'A-välierät',AF:'A-finaali',BQF:'B-puolivälierät',BSF:'B-välierät',BF:'B-finaali',GF:'Finaali',B1:'B-lohkon ottelut',AQ:'A-lohkon ottelut',BQ:'B-lohkon ottelut'};
  return map[stageCode(g)]||('Vaihe '+(stageCode(g)||'—'));
}
function gameStatus(g){
  const s=Number(g.status??g.Status);
  if(s===2&&!(Number(g.EndTime)>0))return 'live';
  if(Number(g.EndTime)>0||s===4)return 'done';
  return 'waiting';
}
function scoreText(g){
  const w=Array.isArray(g.wins)?g.wins:null;
  if(!w||w.length<2)return '–';
  if(gameStatus(g)==='waiting'&&!w.some(v=>Number(v)>0))return '–';
  return `${Number(w[0])||0} – ${Number(w[1])||0}`;
}
function boardText(g){
  const num=g.gameSpot?.Number??g.gameSpot?.number??g.gameSpot?.No??g.gameSpot?.no;
  return num!==undefined&&num!==null&&String(num).trim()!==''?`Taulu ${num}`:'Taulu —';
}
function timeText(g){
  const raw=g.StartTime??g.startTime??g.RealStartTime??g.realStartTime;
  const start=typeof raw==='string'&&!/^\d+(\.\d+)?$/.test(raw)?Date.parse(raw):Number(raw);
  return Number.isFinite(start)&&start>1000000000000?`Klo ${new Date(start).toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'})}`:'Klo —';
}
function gameOrder(g,index){
  const id=Number(g.id);
  return Number.isFinite(id)?id+1:index+1;
}
function sortByOrder(arr){
  return arr.map((g,i)=>({g,i})).sort((a,b)=>{
    const ai=Number(a.g.id),bi=Number(b.g.id);
    if(Number.isFinite(ai)&&Number.isFinite(bi)&&ai!==bi)return ai-bi;
    return a.i-b.i;
  }).map(x=>x.g);
}
async function loadEventNames(){
  try{
    const r=await fetch('/api/event?id='+encodeURIComponent(eventId)+'&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const detail=await r.json();
    const root=detail?.EventData||detail?.eventData||detail;
    players=extractPlayers(detail);
    eventTitle=publicEventTitle(root?.Title??root?.title??root?.Name??root?.name??root?.EventName??'');
  }catch(e){console.warn('Kilpailun tietojen haku epäonnistui',e);}
}
async function fetchGames(){
  const r=await fetch('/api/diagram',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({eventId}),cache:'no-store'});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw Error(d.error||`Otteluhaku HTTP ${r.status}`)}
  const data=await r.json();
  if(!Array.isArray(data))throw Error('Kisailu palautti odottamattoman ottelulistan rakenteen.');
  return sortByOrder(data.map(normalize));
}
async function refreshData(){
  if(inFlight)return;inFlight=true;
  try{
    if(!Object.keys(players).length)await loadEventNames();
    const next=await fetchGames();
    games=next;lastUpdated=new Date();render();
    $('status').textContent=`${games.length} OTTELUA · ${lastUpdated.toLocaleTimeString('fi-FI')}`;
    $('connection').textContent='LIVE-DATA';$('connection').className='connection';
  }catch(e){
    $('connection').textContent='YHTEYSVIRHE';$('connection').className='connection bad';
    $('status').textContent=e.message+(lastUpdated?' · näytetään viimeisin onnistunut data':'');
    if(!games.length)$('content').innerHTML=`<div class="error">Ottelutietoja ei saatu haettua.<br>${escapeHtml(e.message)}</div>`;
  }finally{inFlight=false;}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(refreshData,refreshMs);}
window.addEventListener('resize',()=>{if(window.renderCurrent)window.renderCurrent()});


function playerAverage(g,i){
  // Sama ottelukeskiarvon laskenta kuin toimivassa live-tulostaulussa.
  const stat=(Array.isArray(g.stats)?g.stats[i]:g.stats?.[i])||{};
  const d=stat.Darts||stat.darts||{};
  const legDarts=Array.isArray(d.LegDarts)?d.LegDarts:(Array.isArray(d.legDarts)?d.legDarts:[]);
  const legPoints=Array.isArray(d.LegPoints)?d.LegPoints:(Array.isArray(d.legPoints)?d.legPoints:[]);
  const completedDarts=legDarts.reduce((sum,n)=>sum+(Number(n)||0),0);
  const completedPoints=legPoints.reduce((sum,n)=>sum+(Number(n)||0),0);
  const ended=Number(g.EndTime??g.endTime)>0||Number(g.status??g.Status)===4;
  const currentDarts=Array.isArray(g.darts)?Math.max(0,Number(g.darts[i])||0):0;
  const start=Number(g.start_scores?.[i]??g.startScores?.[i]??d.StartScore??d.startScore??501);
  const rawRemaining=(g.scores??g.remainingScores)?.[i];
  let remaining=rawRemaining===undefined||rawRemaining===null||rawRemaining===''?NaN:Number(rawRemaining);
  if(!Number.isFinite(remaining)){
    const legScores=Array.isArray(d.LegScores)?d.LegScores:(Array.isArray(d.legScores)?d.legScores:[]);
    const lastLeg=legScores.length?legScores[legScores.length-1]:null;
    remaining=Array.isArray(lastLeg)&&lastLeg.length?Number(lastLeg[0]):start;
  }
  if(!Number.isFinite(remaining))remaining=start;
  const currentLegPoints=!ended&&rawRemaining!==undefined&&rawRemaining!==null&&rawRemaining!==''?Math.max(0,start-remaining):0;
  const matchDarts=completedDarts+(!ended?currentDarts:0);
  const matchPoints=completedPoints+(!ended?currentLegPoints:0);
  return matchDarts>0?((matchPoints/matchDarts)*3).toFixed(2).replace('.',','):'—';
}
function fitCanvas(){
  const designW=width||1920,designH=1080;
  const fit=Math.min(window.innerWidth/designW,window.innerHeight/designH);
  const factor=fit*Math.min(scale,1);
  $('wrap').style.transform=`translate(-50%,-50%) scale(${factor})`;
}

function render(){
  $('eventTitle').textContent=publicEventTitle(eventTitle);
  const pageSize=16,totalPages=Math.max(1,Math.ceil(games.length/pageSize));
  pageIndex=Math.min(pageIndex,totalPages-1);
  const first=pageIndex*pageSize,visible=games.slice(first,first+pageSize);
  const left=visible.slice(0,8),right=visible.slice(8,16);
  const makeCard=(g,localIndex)=>{
    const i=first+localIndex,st=gameStatus(g),names=[playerName(g,0),playerName(g,1)];
    const order=gameOrder(g,i),label=stageName(g),score=scoreText(g),board=boardText(g),clock=timeText(g);
    const state=st==='live'?'KÄYNNISSÄ':st==='done'?'PÄÄTTYNYT':'TULOSSA';
    const avgs=[playerAverage(g,0),playerAverage(g,1)];
    const avg=value=>value==='—'?'—':value;
    return `<article class="match ${st}"><span class="number">${String(order).padStart(2,'0')}</span><div class="players"><div class="player"><span class="name">${escapeHtml(names[0])}</span><span class="avgline">KA. <b>${escapeHtml(avg(avgs[0]))}</b></span></div><div class="player"><span class="name">${escapeHtml(names[1])}</span><span class="avgline">KA. <b>${escapeHtml(avg(avgs[1]))}</b></span></div></div><span class="score">${escapeHtml(score==='–'?'—':score)}</span><div class="meta"><span class="stage">${escapeHtml(label)}</span><span class="board">${escapeHtml(board||'Taulu —')}</span><span class="time">${escapeHtml(clock)}</span></div><span class="state ${st}">${state}</span></article>`;
  };
  const makeColumn=(items,offset)=>`<section class="match-column">${items.map((g,i)=>makeCard(g,offset+i)).join('')}</section>`;
  $('content').innerHTML=visible.length?makeColumn(left,0)+makeColumn(right,8):'<div class="error">Tälle kilpailulle ei löytynyt otteluita.</div>';
  const from=visible.length?first+1:0,to=first+visible.length;
  $('refreshInfo').textContent=`OTTELUT ${from}–${to} / ${games.length} · SIVU ${pageIndex+1}/${totalPages} · PÄIVITYS ${Math.round(refreshMs/1000)} S`;
  fitCanvas();
}
window.renderCurrent=render;
$('wrap').style.setProperty('--content-width',width+'px');window.addEventListener('resize',fitCanvas);fitCanvas();
refreshData();startRefresh();
pageTimer=setInterval(()=>{if(games.length>16){pageIndex=(pageIndex+1)%Math.ceil(games.length/16);render();}},Math.max(10000,refreshMs));
</script></body></html>
