<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darts TV – ottelujärjestys</title>
<style>
:root{--yellow:#ffe500;--green:#00f52d;--bg:#05090b;--line:#344047;--white:#f7f9fa;--muted:#aab5ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{position:relative}
#wrap{position:absolute;left:50%;top:50%;width:var(--content-width,1920px);height:1080px;padding:24px 30px 18px;display:flex;flex-direction:column;transform-origin:center center;background:transparent}
header{height:82px;flex:0 0 82px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 0 13px;border-bottom:3px solid var(--green)}
.titleline{display:flex;align-items:center;gap:15px;min-width:0}.titlebadge{display:inline-flex;align-items:center;min-height:42px;padding:0 17px;background:var(--yellow);color:#05090b;font-size:30px;line-height:1;font-weight:950;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}.subtitle{max-width:780px;color:var(--white);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liveinfo{display:flex;align-items:center;gap:14px;min-width:0;color:var(--muted);font-size:13px;font-weight:900;text-align:right;white-space:nowrap}.connection{color:var(--green);display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px #00f52d88}
#content{height:0;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:12px 10px;padding:13px 0 9px}
.match{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(112deg,#172126,#080d10);border:1px solid #46535a;border-top:3px solid var(--yellow);border-bottom:3px solid var(--green);box-shadow:0 4px 12px #0008}
.match.live{border-top-color:var(--yellow);box-shadow:0 0 0 1px #ffe50030,0 5px 14px #0009}.match.waiting{border-top-color:#657178}.match.done{border-top-color:#77838a;border-bottom-color:var(--green)}
.cardhead{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#111c22;border-bottom:1px solid #354148}.number{color:var(--yellow);font-size:22px;font-weight:950;font-variant-numeric:tabular-nums}.stage{min-width:0;color:var(--muted);font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{margin-left:auto;font-size:9px;font-weight:950;letter-spacing:.2px;text-transform:uppercase;color:var(--muted);white-space:nowrap}.state.live{color:var(--yellow)}.state.done{color:var(--green)}
.players{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 10px 4px;gap:7px}.player{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:5px 0;border-bottom:1px solid #344047}.player:last-child{border-bottom:0}.name{min-width:0;color:var(--white);font-size:clamp(12px,1.02vw,18px);line-height:1.12;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avgline{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.35px}.avgline b{color:var(--green);font-size:clamp(13px,.9vw,17px);font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:0}
.cardfoot{height:57px;flex:0 0 57px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px;padding:5px 10px;background:#0b1216;border-top:1px solid #344047}.score{color:var(--green);font-size:clamp(19px,1.6vw,29px);font-weight:950;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}.board{color:var(--muted);font-size:9px;line-height:1.25;text-align:right;font-weight:800;white-space:normal}.empty,.error{grid-column:1/-1;align-self:center;padding:28px;background:#111c22;color:#ffd9d9;border:1px solid #a33;font-size:18px}
footer{height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px;font-weight:700;border-top:1px solid #344047;padding-top:5px}
</style></head><body><div class="wrap" id="wrap"><header><div class="titleline"><span class="titlebadge">OTTELUJÄRJESTYS</span><span class="subtitle" id="eventTitle">Kisailu · haetaan kilpailua…</span></div><div class="liveinfo"><span id="connection" class="connection"><i class="dot"></i> LIVE-DATA</span><span id="status">Haetaan otteluita…</span></div></header><main id="content"></main><footer><span>OTTELUT KISAILU.NETIN JÄRJESTYKSESSÄ · AVG = OTTELUN 3 TIKAN KESKIARVO</span><span id="refreshInfo"></span></footer></div>
<script>

const params=new URLSearchParams(location.search);
const eventId=(params.get('event')||params.get('eventId')||'EVE#sml26p0426').trim();
const refreshMs=Math.max(3000,Math.min(60000,(Number(params.get('refresh'))||10)*1000));
const scale=Math.max(50,Math.min(200,Number(params.get('scale'))||100))/100;
const width=Math.max(900,Math.min(5000,Number(params.get('width'))||1920));
const $=id=>document.getElementById(id);
let games=[],players={},eventTitle=eventId,refreshTimer=null,pageTimer=null,inFlight=false,lastUpdated=null,pageIndex=0;
const decodeGame=item=>{
  const raw=item?.GameData;
  if(typeof raw!=='string')return raw||item;
  const id=String(item.Id??item.id??'');
  try{
    const bytes=new Uint8Array(raw.match(/.{2}/g).map(x=>parseInt(x,16)));
    const out=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++)out[i]=bytes[i]^id.charCodeAt(i%id.length);
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){console.warn('Ottelun datan purku epäonnistui',id,e);return {};}
};
const normalize=item=>{
  const d=decodeGame(item);
  return {...d,apiId:item?.Id??item?.id??d.Id??d.GameId??d.GameID,EndTime:d.EndTime??0};
};
function extractPlayers(data){
  const root=data?.EventData||data?.eventData||data;
  const src=root?.GamePlayers??root?.gamePlayers??root?.Players??root?.players;
  const out={};
  if(Array.isArray(src))src.forEach((p,i)=>{
    if(typeof p==='string'){out[String(i)]=p;return;}
    if(!p)return;
    const name=String(p.Name??p.name??p.DisplayName??p.displayName??p.Title??p.title??('Pelaaja '+i));
    out[String(p.index??p.Index??i)]=name;
    if(p.id??p.Id)out[String(p.id??p.Id)]=name;
  });
  else if(src&&typeof src==='object')for(const [k,p] of Object.entries(src)){
    out[String(k)]=typeof p==='string'?p:String(p?.Name??p?.name??p?.DisplayName??p?.displayName??p?.Title??p?.title??p);
  }
  return out;
}
function playerName(g,i){
  const p=(g.players||[])[i];
  if(p===undefined||p===null||Number(p)<0||Number(p)===40)return 'Odottaa jatkoonmenijää';
  return players[String(p)]||('Pelaaja '+p);
}
function stageCode(g){return String(g.r??g.round??g.Round??'').trim().toUpperCase();}
function stageName(g){
  const custom=String(g.d??'').trim();
  if(custom&&custom!=='-'&&!/^[AB]$/i.test(custom))return custom;
  const map={AQF:'A-puolivälierät',ASF:'A-välierät',AF:'A-finaali',BQF:'B-puolivälierät',BSF:'B-välierät',BF:'B-finaali',GF:'Finaali',B1:'B-lohkon ottelut',AQ:'A-lohkon ottelut',BQ:'B-lohkon ottelut'};
  return map[stageCode(g)]||('Vaihe '+(stageCode(g)||'—'));
}
function gameStatus(g){
  const s=Number(g.status??g.Status);
  if(s===2&&!(Number(g.EndTime)>0))return 'live';
  if(Number(g.EndTime)>0||s===4)return 'done';
  return 'waiting';
}
function scoreText(g){
  const w=Array.isArray(g.wins)?g.wins:null;
  if(!w||w.length<2)return '–';
  if(gameStatus(g)==='waiting'&&!w.some(v=>Number(v)>0))return '–';
  return `${Number(w[0])||0} – ${Number(w[1])||0}`;
}
function boardText(g){
  const num=g.gameSpot?.Number??g.gameSpot?.number;
  const start=Number(g.StartTime);
  const clock=Number.isFinite(start)&&start>1000000000000?new Date(start).toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'}):'';
  return [num!==undefined&&num!==null?`Taulu ${num}`:'',clock?`Klo ${clock}`:''].filter(Boolean).join(' · ');
}
function gameOrder(g,index){
  const id=Number(g.id);
  return Number.isFinite(id)?id+1:index+1;
}
function sortByOrder(arr){
  return arr.map((g,i)=>({g,i})).sort((a,b)=>{
    const ai=Number(a.g.id),bi=Number(b.g.id);
    if(Number.isFinite(ai)&&Number.isFinite(bi)&&ai!==bi)return ai-bi;
    return a.i-b.i;
  }).map(x=>x.g);
}
async function loadEventNames(){
  try{
    const r=await fetch('/api/event?id='+encodeURIComponent(eventId)+'&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const detail=await r.json();
    const root=detail?.EventData||detail?.eventData||detail;
    players=extractPlayers(detail);
    eventTitle=String(root?.Title??root?.title??root?.Name??root?.name??root?.EventName??eventId);
  }catch(e){console.warn('Kilpailun tietojen haku epäonnistui',e);}
}
async function fetchGames(){
  const r=await fetch('/api/diagram',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({eventId}),cache:'no-store'});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw Error(d.error||`Otteluhaku HTTP ${r.status}`)}
  const data=await r.json();
  if(!Array.isArray(data))throw Error('Kisailu palautti odottamattoman ottelulistan rakenteen.');
  return sortByOrder(data.map(normalize));
}
async function refreshData(){
  if(inFlight)return;inFlight=true;
  try{
    if(!Object.keys(players).length)await loadEventNames();
    const next=await fetchGames();
    games=next;lastUpdated=new Date();render();
    $('status').textContent=`${eventTitle} · ${games.length} ottelua · päivitetty ${lastUpdated.toLocaleTimeString('fi-FI')}`;
    $('connection').textContent='LIVE-DATA';$('connection').className='connection';
  }catch(e){
    $('connection').textContent='YHTEYSVIRHE';$('connection').className='bad';
    $('status').textContent=e.message+(lastUpdated?' · näytetään viimeisin onnistunut data':'');
    if(!games.length)$('content').innerHTML=`<div class="error">Ottelutietoja ei saatu haettua.<br>${escapeHtml(e.message)}</div>`;
  }finally{inFlight=false;}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(refreshData,refreshMs);}
window.addEventListener('resize',()=>{if(window.renderCurrent)window.renderCurrent()});


function playerAverage(g,i){
  const stat=g.stats?.[i]||{},d=stat.Darts||{};
  if(stat.GameType&&String(stat.GameType).toLowerCase()!=='x01')return '—';
  const legDarts=Array.isArray(d.LegDarts)?d.LegDarts:[];
  const legPoints=Array.isArray(d.LegPoints)?d.LegPoints:[];
  const completedDarts=legDarts.reduce((a,n)=>a+(Number(n)||0),0);
  const completedPoints=legPoints.reduce((a,n)=>a+(Number(n)||0),0);
  const ended=Number(g.EndTime)>0||Number(g.status??g.Status)===4;
  const currentDarts=Array.isArray(g.darts)?Math.max(0,Number(g.darts[i])||0):0;
  const start=Number(g.start_scores?.[i]??501);
  const rawRemaining=g.scores?.[i];
  let remaining=rawRemaining===undefined||rawRemaining===null||rawRemaining===''?NaN:Number(rawRemaining);
  if(!Number.isFinite(remaining)){
    const legScores=Array.isArray(d.LegScores)?d.LegScores:[];
    const lastLeg=legScores.length?legScores[legScores.length-1]:null;
    remaining=Array.isArray(lastLeg)&&lastLeg.length?Number(lastLeg[0]):start;
  }
  if(!Number.isFinite(remaining))remaining=start;
  const livePoints=!ended?Math.max(0,start-remaining):0;
  const darts=completedDarts+(!ended?currentDarts:0);
  const points=completedPoints+(!ended?livePoints:0);
  return darts>0?((points/darts)*3).toFixed(2).replace('.',','):'—';
}
function fitCanvas(){
  const designW=width||1920,designH=1080;
  const fit=Math.min(window.innerWidth/designW,window.innerHeight/designH);
  const factor=fit*Math.min(scale,1);
  $('wrap').style.transform=`translate(-50%,-50%) scale(${factor})`;
}

function render(){
  $('eventTitle').textContent=eventTitle;
  $('refreshInfo').textContent=`PÄIVITYS ${Math.round(refreshMs/1000)} S`;
  const pageSize=16,totalPages=Math.max(1,Math.ceil(games.length/pageSize));
  pageIndex=Math.min(pageIndex,totalPages-1);
  const first=pageIndex*pageSize,visible=games.slice(first,first+pageSize);
  const cols=visible.length>8?8:4;
  $('content').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  $('content').style.gridTemplateRows=`repeat(${Math.max(1,Math.ceil(visible.length/cols))},minmax(0,1fr))`;
  if(games.length>pageSize){
    $('status').textContent=`${eventTitle} · OTTELUT ${first+1}–${Math.min(first+pageSize,games.length)} / ${games.length}`;
  }
  const rows=visible.map((g,localIndex)=>{
    const i=first+localIndex,st=gameStatus(g),names=[playerName(g,0),playerName(g,1)];
    const order=gameOrder(g,i),label=stageName(g),score=scoreText(g),board=boardText(g);
    const state=st==='live'?'KÄYNNISSÄ':st==='done'?'PÄÄTTYNYT':'TULOSSA';
    const avgs=[playerAverage(g,0),playerAverage(g,1)];
    return `<article class="match ${st}"><div class="cardhead"><span class="number">${String(order).padStart(2,'0')}</span><span class="stage">${escapeHtml(label)}</span><span class="state ${st}">${state}</span></div><div class="players"><div class="player"><span class="name">${escapeHtml(names[0])}</span><span class="avgline">OTTELUKESKIARVO <b>${escapeHtml(avgs[0])}</b></span></div><div class="player"><span class="name">${escapeHtml(names[1])}</span><span class="avgline">OTTELUKESKIARVO <b>${escapeHtml(avgs[1])}</b></span></div></div><div class="cardfoot"><span class="score">${escapeHtml(score)}</span><span class="board">${escapeHtml(board||'')}</span></div></article>`;
  });
  $('content').innerHTML=rows.join('')||'<div class="error">Tälle kilpailulle ei löytynyt otteluita.</div>';
  fitCanvas();
}
window.renderCurrent=render;
$('wrap').style.setProperty('--content-width',width+'px');window.addEventListener('resize',fitCanvas);fitCanvas();
refreshData();startRefresh();
pageTimer=setInterval(()=>{if(games.length>16){pageIndex=(pageIndex+1)%Math.ceil(games.length/16);render();}},Math.max(10000,refreshMs));
</script></body></html>
