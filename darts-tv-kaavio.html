<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darts TV – ottelukaavio</title>
<style>
:root{--yellow:#ffe500;--green:#00f52d;--bg:#05090b;--line:#344047;--white:#f7f9fa;--muted:#aab5ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:Arial,Helvetica,sans-serif}
#screen{position:absolute;left:50%;top:50%;width:var(--board-width,1920px);height:1080px;padding:24px 30px 18px;display:flex;flex-direction:column;transform-origin:center center}
.top{height:82px;flex:0 0 82px;display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:3px solid var(--green);padding-bottom:13px}.titleline{display:flex;align-items:center;gap:15px;min-width:0}.titlebadge{display:inline-flex;align-items:center;min-height:42px;padding:0 17px;background:var(--yellow);color:#05090b;font-size:30px;line-height:1;font-weight:950;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}.subtitle{max-width:780px;color:var(--white);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:900;color:var(--muted);text-align:right;white-space:nowrap}.good{color:var(--green)}.bad{color:#ff6a6a}
#content{position:relative;height:0;flex:1 1 auto;min-height:0;margin-top:13px;border:1px solid #344047;border-top:2px solid var(--yellow);border-bottom:3px solid var(--green);background:linear-gradient(145deg,#0c1419e8,#05090ce8);overflow:hidden}
#content:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:100px 100px;pointer-events:none}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}.wires path{fill:none;stroke:#829098;stroke-width:2.4;opacity:.64}.wires path.feed{stroke:var(--green);stroke-width:3.2;opacity:.86}
.game{position:absolute;transform:translate(-50%,-50%);width:var(--card-width,220px);height:var(--card-height,62px);display:flex;flex-direction:column;overflow:hidden;z-index:2;background:linear-gradient(110deg,#172126,#080d10);border:1px solid #46535a;border-top:2px solid var(--yellow);border-bottom:2px solid var(--green);box-shadow:0 3px 10px #0008}.game.live{border-top-color:var(--yellow);box-shadow:0 0 0 1px #ffe50035,0 4px 12px #0009}.game.waiting{border-top-color:#657178}.ghead{height:17px;flex:0 0 17px;display:flex;justify-content:space-between;align-items:center;padding:0 6px;background:#111c22;border-bottom:1px solid #344047;gap:6px}.round{min-width:0;font-size:9px;font-weight:950;color:var(--yellow);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-size:8px;font-weight:950;color:var(--muted);text-transform:uppercase;white-space:nowrap}.state.live{color:var(--yellow)}.state.done{color:var(--green)}.side{height:calc((100% - 17px)/2);min-height:0;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 7px;font-size:clamp(8px,.68vw,12px);font-weight:900}.side+.side{border-top:1px solid #344047}.name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{color:var(--green);font-size:clamp(9px,.85vw,14px);font-weight:950;min-width:14px;text-align:right}.empty,.error{position:absolute;left:30px;right:30px;top:40%;padding:25px;background:#111c22;color:#ffd9d9;border:1px solid #a33;font-size:18px}
footer{height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px;font-weight:700;border-top:1px solid #344047;margin-top:6px;padding-top:5px}
</style></head><body><div id="screen"><header class="top"><div class="titleline"><span class="titlebadge">OTTELUKAAVIO</span><span class="subtitle" id="eventTitle">Kisailu · haetaan kilpailua…</span></div><div class="info"><span id="connection" class="good">LIVE-DATA</span><span id="status">Haetaan otteluita…</span></div></header><main id="content"></main><footer><span>OTTELUKAAVIO · KISAILU.NET LIVE-DATA</span><span id="refreshInfo"></span></footer></div>
<script>

const params=new URLSearchParams(location.search);
const eventId=(params.get('event')||params.get('eventId')||'EVE#sml26p0426').trim();
const refreshMs=Math.max(3000,Math.min(60000,(Number(params.get('refresh'))||10)*1000));
const scale=Math.max(50,Math.min(200,Number(params.get('scale'))||100))/100;
const width=Math.max(900,Math.min(5000,Number(params.get('width'))||1920));
const $=id=>document.getElementById(id);
let games=[],players={},eventTitle='Ottelupäivän ottelut',refreshTimer=null,inFlight=false,lastUpdated=null;
const decodeGame=item=>{
  const raw=item?.GameData;
  if(typeof raw!=='string')return raw||item;
  const id=String(item.Id??item.id??'');
  try{
    const bytes=new Uint8Array(raw.match(/.{2}/g).map(x=>parseInt(x,16)));
    const out=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++)out[i]=bytes[i]^id.charCodeAt(i%id.length);
    return JSON.parse(new TextDecoder().decode(out));
  }catch(e){console.warn('Ottelun datan purku epäonnistui',id,e);return {};}
};
const normalize=item=>{
  const d=decodeGame(item);
  return {...d,apiId:item?.Id??item?.id??d.Id??d.GameId??d.GameID,EndTime:d.EndTime??0};
};
function extractPlayers(data){
  const root=data?.EventData||data?.eventData||data;
  const src=root?.GamePlayers??root?.gamePlayers??root?.Players??root?.players;
  const out={};
  if(Array.isArray(src))src.forEach((p,i)=>{
    if(typeof p==='string'){out[String(i)]=p;return;}
    if(!p)return;
    const name=String(p.Name??p.name??p.DisplayName??p.displayName??p.Title??p.title??('Pelaaja '+i));
    out[String(p.index??p.Index??i)]=name;
    if(p.id??p.Id)out[String(p.id??p.Id)]=name;
  });
  else if(src&&typeof src==='object')for(const [k,p] of Object.entries(src)){
    out[String(k)]=typeof p==='string'?p:String(p?.Name??p?.name??p?.DisplayName??p?.displayName??p?.Title??p?.title??p);
  }
  return out;
}
function playerName(g,i){
  const p=(g.players||[])[i];
  if(p===undefined||p===null||Number(p)<0||Number(p)===40)return 'Odottaa jatkoonmenijää';
  return players[String(p)]||('Pelaaja '+p);
}
function publicEventTitle(value){const clean=String(value??'').replace(/EVE#[A-Za-z0-9_-]+/gi,'').replace(/[·|–—-]+/g,' ').replace(/\s+/g,' ').trim();return clean||'Ottelupäivän ottelut';}
function stageCode(g){return String(g.r??g.round??g.Round??'').trim().toUpperCase();}
function stageName(g){
  const custom=String(g.d??'').trim();
  if(custom&&custom!=='-'&&!/^[AB]$/i.test(custom))return custom;
  const map={AQF:'A-puolivälierät',ASF:'A-välierät',AF:'A-finaali',BQF:'B-puolivälierät',BSF:'B-välierät',BF:'B-finaali',GF:'Finaali',B1:'B-lohkon ottelut',AQ:'A-lohkon ottelut',BQ:'B-lohkon ottelut'};
  return map[stageCode(g)]||('Vaihe '+(stageCode(g)||'—'));
}
function gameStatus(g){
  const s=Number(g.status??g.Status);
  if(s===2&&!(Number(g.EndTime)>0))return 'live';
  if(Number(g.EndTime)>0||s===4)return 'done';
  return 'waiting';
}
function scoreText(g){
  const w=Array.isArray(g.wins)?g.wins:null;
  if(!w||w.length<2)return '–';
  if(gameStatus(g)==='waiting'&&!w.some(v=>Number(v)>0))return '–';
  return `${Number(w[0])||0} – ${Number(w[1])||0}`;
}
function boardText(g){
  const num=g.gameSpot?.Number??g.gameSpot?.number;
  return num!==undefined&&num!==null?`Taulu ${num}`:'';
}
function gameOrder(g,index){
  const id=Number(g.id);
  return Number.isFinite(id)?id+1:index+1;
}
function sortByOrder(arr){
  return arr.map((g,i)=>({g,i})).sort((a,b)=>{
    const ai=Number(a.g.id),bi=Number(b.g.id);
    if(Number.isFinite(ai)&&Number.isFinite(bi)&&ai!==bi)return ai-bi;
    return a.i-b.i;
  }).map(x=>x.g);
}
async function loadEventNames(){
  try{
    const r=await fetch('/api/event?id='+encodeURIComponent(eventId)+'&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const detail=await r.json();
    const root=detail?.EventData||detail?.eventData||detail;
    players=extractPlayers(detail);
    eventTitle=publicEventTitle(root?.Title??root?.title??root?.Name??root?.name??root?.EventName??'');
  }catch(e){console.warn('Kilpailun tietojen haku epäonnistui',e);}
}
async function fetchGames(){
  const r=await fetch('/api/diagram',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({eventId}),cache:'no-store'});
  if(!r.ok){let d={};try{d=await r.json()}catch{};throw Error(d.error||`Otteluhaku HTTP ${r.status}`)}
  const data=await r.json();
  if(!Array.isArray(data))throw Error('Kisailu palautti odottamattoman ottelulistan rakenteen.');
  return sortByOrder(data.map(normalize));
}
async function refreshData(){
  if(inFlight)return;inFlight=true;
  try{
    if(!Object.keys(players).length)await loadEventNames();
    const next=await fetchGames();
    games=next;lastUpdated=new Date();render();
    $('status').textContent=`${games.length} ottelua · päivitetty ${lastUpdated.toLocaleTimeString('fi-FI')}`;
    $('connection').textContent='LIVE-DATA';$('connection').className='good';
  }catch(e){
    $('connection').textContent='YHTEYSVIRHE';$('connection').className='bad';
    $('status').textContent=e.message+(lastUpdated?' · näytetään viimeisin onnistunut data':'');
    if(!games.length)$('content').innerHTML=`<div class="error">Ottelutietoja ei saatu haettua.<br>${escapeHtml(e.message)}</div>`;
  }finally{inFlight=false;}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function startRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(refreshData,refreshMs);}
window.addEventListener('resize',()=>{if(window.renderCurrent)window.renderCurrent()});

function fitCanvas(){
  const designW=width||1920,designH=1080;
  const fit=Math.min(window.innerWidth/designW,window.innerHeight/designH);
  $('screen').style.transform=`translate(-50%,-50%) scale(${fit*Math.min(scale,1)})`;
}
function render(){
  $('eventTitle').textContent=publicEventTitle(eventTitle);
  $('refreshInfo').textContent=`PÄIVITYS ${Math.round(refreshMs/1000)} S`;
  if(!games.length){$('content').innerHTML='<div class="empty">Tälle kilpailulle ei löytynyt ottelukaavion otteluita.</div>';return;}

  const valid=games.filter(g=>g.x!==undefined&&g.x!==null&&Number.isFinite(Number(g.x)));
  const buckets=new Map();
  games.forEach((g,i)=>{
    const key=valid.length&&g.x!==undefined&&g.x!==null&&Number.isFinite(Number(g.x))?String(Number(g.x)):'0';
    if(!buckets.has(key))buckets.set(key,[]);
    buckets.get(key).push({g,i});
  });
  const columns=[...buckets.entries()].sort((a,b)=>Number(a[0])-Number(b[0]));
  const count=columns.length,areaW=$('content').clientWidth||width-60,areaH=$('content').clientHeight||915,topPad=40,bottomPad=35;
  const maxRows=Math.max(...columns.map(([,arr])=>arr.length));
  const cardW=count<=2?Math.min(390,(areaW-(count-1)*30)/count):Math.min(250,(areaW-((count-1)*20))/count);
  const slotH=(areaH-topPad-bottomPad)/Math.max(1,maxRows);
  const cardH=Math.max(26,Math.min(78,slotH*.86));
  const gap=(areaW-count*cardW)/Math.max(1,count-1);
  const xCenters=columns.map((_,i)=>count===1?areaW/2:cardW/2+i*(cardW+gap));
  const coords=new Map(),columnLabels=[];
  columns.forEach(([key,items],col)=>{
    items.sort((a,b)=>{
      const ay=Number(a.g.y),by=Number(b.g.y);
      if(Number.isFinite(ay)&&Number.isFinite(by)&&ay!==by)return ay-by;
      const ai=Number(a.g.id),bi=Number(b.g.id);
      return Number.isFinite(ai)&&Number.isFinite(bi)?ai-bi:a.i-b.i;
    });
    columnLabels.push({x:xCenters[col],label:stageName(items[0].g)});
    items.forEach((item,row)=>{
      const cy=topPad+(row+.5)*(areaH-topPad-bottomPad)/Math.max(1,items.length);
      coords.set(String(item.g.id??item.i),{cx:xCenters[col],cy,g:item.g,i:item.i,col,row});
    });
  });

  const edges=[];
  games.forEach((target,i)=>{
    const raw=target.needs_opponent_push;
    if(raw===undefined||raw===null||String(raw).trim()==='')return;
    const dep=String(Number(raw));
    const source=coords.get(dep),dest=coords.get(String(target.id??i));
    if(!source||!dest||source===dest)return;
    const dir=dest.cx>=source.cx?1:-1;
    const x1=source.cx+dir*(cardW/2-1),x2=dest.cx-dir*(cardW/2-1),y1=source.cy,y2=dest.cy;
    const bend=Math.max(24,Math.abs(x2-x1)*.42);
    const c1=x1+dir*bend,c2=x2-dir*bend;
    edges.push(`<path class="feed" d="M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2}"/>`);
  });
  const wireSvg=`<svg class="wires" viewBox="0 0 ${areaW} ${areaH}" preserveAspectRatio="none">${edges.join('')}</svg>`;
  const cards=games.map((g,i)=>{
    const c=coords.get(String(g.id??i)),st=gameStatus(g),names=[playerName(g,0),playerName(g,1)],score=scoreText(g);
    const parts=score==='–'?['','']:score.split(' – ');
    const state=st==='live'?'KÄYNNISSÄ':st==='done'?'PÄÄTTYNYT':'TULOSSA';
    return `<article class="game ${st}" style="left:${c.cx}px;top:${c.cy}px;--card-width:${cardW}px;--card-height:${cardH}px"><div class="ghead"><span class="round">${escapeHtml(stageName(g))}</span><span class="state ${st}">${state}</span></div><div class="side"><span class="name">${escapeHtml(names[0])}</span><span class="score">${escapeHtml(parts[0])}</span></div><div class="side"><span class="name">${escapeHtml(names[1])}</span><span class="score">${escapeHtml(parts[1])}</span></div></article>`;
  }).join('');
  $('content').innerHTML=wireSvg+cards;
  fitCanvas();
}
window.renderCurrent=render;
document.documentElement.style.setProperty('--board-width',width+'px');
window.addEventListener('resize',fitCanvas);
fitCanvas();
refreshData();startRefresh();
</script></body></html>
